apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: securebackend
  namespace: backend

spec:
  provider: azure

  secretObjects:
    - secretName: postgres-secret
      type: Opaque
      data:
        - objectName: POSTGRES-USER
          key: DB_USER
        - objectName: POSTGRES-PASSWORD
          key: DB_PASSWORD
        - objectName: POSTGRES-DB
          key: DB_NAME

  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "d53d91ab-c57d-4f35-94ed-475509e1303b"
    keyvaultName: "secureshop-dev-kv-9898"
    tenantId: "ffc44944-9df7-460d-95f5-4ebc37222999"

    objects: |
      array:
        - |
          objectName: POSTGRES-USER
          objectType: secret
        - |
          objectName: POSTGRES-PASSWORD
          objectType: secret
        - |
          objectName: POSTGRES-DB
          objectType: secret