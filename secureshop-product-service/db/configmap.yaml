apiVersion: v1
kind: ConfigMap

metadata:
  name: postgres-init
  namespace: database

data:
  init.sql: |
    -- SecureShop Product Service - schema initialization

    CREATE TABLE IF NOT EXISTS products (
      id SERIAL PRIMARY KEY,
      name VARCHAR(255) NOT NULL,
      description TEXT DEFAULT '',
      price NUMERIC(10, 2) NOT NULL CHECK (price >= 0),
      stock INTEGER NOT NULL DEFAULT 0 CHECK (stock >= 0),
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_products_name
      ON products (name);

    -- Keep updated_at fresh on every row change

    CREATE OR REPLACE FUNCTION set_updated_at()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = now();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS trg_products_updated_at
      ON products;

    CREATE TRIGGER trg_products_updated_at
      BEFORE UPDATE ON products
      FOR EACH ROW
      EXECUTE FUNCTION set_updated_at();

    -- Sample seed data

    INSERT INTO products (name, description, price, stock)
    VALUES
      ('Wireless Mouse',
       'Ergonomic 2.4GHz wireless mouse',
       799.00,
       120),

      ('Mechanical Keyboard',
       'RGB backlit mechanical keyboard',
       3499.00,
       45),

      ('USB-C Hub',
       '7-in-1 USB-C hub with HDMI',
       1899.00,
       80)
    ON CONFLICT DO NOTHING;